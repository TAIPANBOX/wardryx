# Build and publish the container image to GitHub Container Registry.
#
#   ghcr.io/<owner>/wardryx:v0.1.0      what a deployment pins
#   ghcr.io/<owner>/wardryx:sha-abc123  what a bisect points at
#
# **Immutable versions, no moving tag.** There is deliberately no `:latest` and
# no `:main`: this is a plane of a governance stack, and "which build is
# running" has to have an answer that does not change under the operator. A tag
# that moves is a deployment whose contents change without a rollout anybody
# recorded (Yurii, 2026-08-02).
#
# Publishing runs on a tag, never on a merge: publishing on every push to main
# would mint artifacts nobody chose to release. `image-build` below also runs
# on a pull request that touches this file (see `pull_request`) and publishes
# nothing; see the `if:` on `image`.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          An existing v* tag to (re)build the release page for. The image is
          not rebuilt: the tag push published it. This exists because the
          release-page job runs for the first time on a tag, and the first
          v1.0.0 run of it failed after the image was already out.
        required: true
  # This workflow otherwise runs only on a `v*` tag, so its one job was proven
  # for the first time by the tag itself. TokenFuse's `v0.4.2` failed exactly
  # that way on 2026-09-02: the tag was the first thing that had ever run its
  # musl step, on a line the step had lost since the day it was written.
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  # Proves the Dockerfile itself still builds on a pull request that touches
  # this workflow, before a tag ever reaches it. See `image` below for the
  # job that actually pushes.
  image-build:
    # Pushes to the registry by digest, so it needs the package scope the
    # top level no longer grants; `contents: read` repeated for the checkout.
    permissions:
      contents: read
      packages: write
    name: build image (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU is registered but not used for the compile: the Go build cross-
      # compiles from the runner's own architecture (see the Dockerfile's
      # BUILDPLATFORM/TARGETARCH). It is here for the base-image layers, which
      # buildx still resolves per platform.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image:
    name: build + push
    # Only on the tag push: image-build above already proves the Dockerfile
    # builds on a pull request, this job is the one that actually pushes to
    # GHCR, and a manual dispatch rebuilds the release page of a tag whose
    # image is already published (see `release` below).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read      # a job-level block replaces the workflow's, and checkout needs this
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU is registered but not used for the compile: the Go build cross-
      # compiles from the runner's own architecture (see the Dockerfile's
      # BUILDPLATFORM/TARGETARCH). It is here for the base-image layers, which
      # buildx still resolves per platform.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/wardryx
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is signed by digest and its provenance attested, keyless. A
      # stranger verifies with
      #   cosign verify ghcr.io/taipanbox/wardryx:<tag> \
      #     --certificate-identity-regexp '^https://github.com/TAIPANBOX/wardryx/\.github/workflows/release\.yml@refs/tags/v' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      #   gh attestation verify oci://ghcr.io/taipanbox/wardryx:<tag> -R TAIPANBOX/wardryx
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: sign the image by digest, keyless
        run: cosign sign --yes "ghcr.io/taipanbox/wardryx@${{ steps.push.outputs.digest }}"
      - name: provenance attestation for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/taipanbox/wardryx
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Say what was published
        run: |
          echo "published:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  /'
          echo
          echo "platforms: linux/amd64, linux/arm64"

  release:
    name: release page
    needs: image
    # On a tag push, after the image; on a manual dispatch naming an existing
    # tag, alone (the image job is skipped, so `!cancelled()` keeps this one
    # from being skipped with it). Never on a pull request.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.image.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      # The SBOM action writes into dist/ and does not create it; the first
      # v1.0.0 run of this job failed here with ENOENT, after the image had
      # already been pushed. The binary-shipping repositories create dist/ when
      # they build; this repository ships an image and has no earlier step.
      - run: mkdir -p dist
      - name: SBOM of this build, SPDX
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM of this build, CycloneDX
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      - name: provenance attestation for the SBOMs
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: the provenance bundle as a release asset too
        run: cp "${{ steps.provenance.outputs.bundle-path }}" dist/provenance.intoto.jsonl
      # A Release for every tag (RELEASE-1.0-PLAN 4.3 item 1): --verify-tag aborts
      # when the tag is not on the remote; the notes are generated from the merged
      # pull requests until a plane's 1.0 notes replace them.
      - name: release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the Release, or upload into one that already exists: the tags
          # cut before this job existed got their Release objects by hand on
          # 2026-09-12, and a re-dispatch against one of them must add the
          # assets rather than fail on a page that is already there.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --verify-tag --title "${TAG}" --generate-notes
          fi
