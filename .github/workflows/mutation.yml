# Weekly mutation run: break the product code on purpose, one fault at a time,
# and count how many of those faults an existing test catches. Coverage counts
# lines that ran; this counts lines an assertion can fail on.
#
# Measured, not gated: --threshold-efficacy 0 never fails a package and no
# score is required yet. The tool is gremlins, pinned to the exact release the
# estate already runs in rollcall (v0.6.0), installed only here, in CI.
#
# Time-bounded: packages run one after another until BUDGET_MINUTES is spent;
# a package still running at the deadline is stopped, and every package not
# reached is listed in the summary, so a partial run says it is partial.
#
# Public repository, standard runner: it costs nothing.
name: mutation

on:
  schedule:
    - cron: "14 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gremlins:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
      - name: install gremlins v0.6.0
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: mutate every tested package within the time budget
        env:
          BUDGET_MINUTES: "300"
        run: |
          set -u
          out="$RUNNER_TEMP/mutation"
          mkdir -p "$out"
          : > "$out/not-reached"
          deadline=$(( $(date +%s) + BUDGET_MINUTES * 60 ))
          mod="$(go list -m)"
          go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... > "$out/packages"
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            rel=".${pkg#"$mod"}"
            name="$(printf '%s' "$rel" | tr '/.' '__')"
            left=$(( deadline - $(date +%s) ))
            if [ "$left" -le 60 ]; then
              printf '%s\n' "$rel" >> "$out/not-reached"
              continue
            fi
            timeout "$left" "$(go env GOPATH)/bin/gremlins" unleash \
              --threshold-efficacy 0 --output "$out/$name.json" "$rel" \
              > "$out/$name.txt" 2>&1
            printf '%s %s\n' "$?" "$rel" >> "$out/exit-codes"
          done < "$out/packages"
      - name: put the kill count on the run page
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/mutation" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import collections, glob, json, os, sys
          d = sys.argv[1]
          rows, tot = [], collections.Counter()
          names, stopped = {}, []
          if os.path.exists(os.path.join(d, "exit-codes")):
              for l in open(os.path.join(d, "exit-codes")):
                  code, rel = l.split(" ", 1)
                  rel = rel.strip()
                  names[rel.replace("/", "_").replace(".", "_")] = rel
                  if code == "124":
                      stopped.append(rel)
          for p in sorted(glob.glob(os.path.join(d, "*.json"))):
              try:
                  r = json.load(open(p))
              except ValueError:
                  continue
              c = collections.Counter()
              for f in r.get("files") or []:
                  for m in f.get("mutations") or []:
                      c[m.get("status", "?")] += 1
              if not c:
                  c.update({"KILLED": r.get("mutants_killed", 0), "LIVED": r.get("mutants_lived", 0),
                            "NOT COVERED": r.get("mutants_not_covered", 0),
                            "NOT VIABLE": r.get("mutants_not_viable", 0)})
              tot.update(c)
              rows.append((names.get(os.path.basename(p)[:-5], os.path.basename(p)), c))
          def n(c):
              return c["KILLED"] + c["LIVED"] + c["TIMED OUT"] + c["NOT COVERED"]
          print("### Mutation testing (gremlins v0.6.0, measured, not gated)\n")
          print(f"**Killed {tot['KILLED']} of {n(tot)}** viable mutants "
                f"(lived {tot['LIVED']}, timed out {tot['TIMED OUT']}, not covered {tot['NOT COVERED']}, "
                f"not viable {tot['NOT VIABLE']}).\n")
          print("| package | killed | lived | timed out | not covered | not viable |")
          print("|---|---|---|---|---|---|")
          for name, c in rows:
              print(f"| {name} | {c['KILLED']} | {c['LIVED']} | {c['TIMED OUT']} | {c['NOT COVERED']} | {c['NOT VIABLE']} |")
          nr = [l.strip() for l in open(os.path.join(d, "not-reached")) if l.strip()] if os.path.exists(os.path.join(d, "not-reached")) else []
          if nr:
              print(f"\nNot reached within the time budget ({len(nr)}): " + ", ".join(nr))
          if stopped:
              print("\nStopped at the deadline, no report: " + ", ".join(stopped))
          if not rows:
              print("\nMEASURED NOTHING: no gremlins report was written.")
          PY
      - name: keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation
          path: ${{ runner.temp }}/mutation/
          if-no-files-found: warn
